<style>
:root{--r:14px;--ui:'Figtree',system-ui,sans-serif;--serif:'Cormorant Garamond',Georgia,serif;--sh:0 1px 2px rgba(90,20,45,.06),0 10px 26px -14px rgba(90,20,45,.25)}

*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--ui);min-height:100vh;display:flex;flex-direction:column;transition:background-color .3s,color .3s}
a{color:var(--link);text-underline-offset:3px}a:hover{color:var(--linkH)}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.1;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2.4rem,8vw,4.2rem)}h2{font-size:clamp(1.7rem,4.5vw,2.3rem)}h3{font-size:1.4rem}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:1rem;padding:.6rem clamp(1rem,4vw,2rem);background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.5rem;font:600 1.65rem/1 var(--serif);text-decoration:none;color:var(--ink)}

nav{display:flex;gap:.15rem;flex:1;justify-content:center}

.tools{display:flex;gap:.6rem;align-items:center}

.themes button i{display:block;width:1.05rem;height:1.05rem;margin:auto;border-radius:50%;border:1px solid var(--mute)}
.themes button:hover{background:transparent}.themes button[aria-pressed=true]{border-color:var(--pink)}
#menu{display:none;min-height:0;width:2.6rem;height:2.6rem;padding:0;background:transparent;color:var(--ink);border:1px solid var(--line)}
#menu:hover{background:var(--soft)}#menu svg{width:1.2rem;height:1.2rem;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.navauth{display:none}
main{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:1.5rem clamp(1rem,4vw,2rem) 4rem}
footer{padding:1.6rem;text-align:center;color:var(--mute);border-top:1px solid var(--line);font-family:var(--serif);font-size:1.15rem}
section{margin-bottom:clamp(3.5rem,10vw,6.5rem)}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}

.hero{position:relative;isolation:isolate;overflow:hidden;padding:clamp(2.5rem,9vw,6rem) 0 clamp(2rem,6vw,4rem)}
.hero .moon{position:absolute;right:-4%;top:0;width:min(62vw,380px);fill:var(--soft);z-index:-1}
.lead{font:italic 500 clamp(1.3rem,4vw,1.9rem)/1.3 var(--serif);color:var(--mute);margin:0 0 1.6rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:clamp(1rem,3vw,1.8rem)}
.card{display:flex;flex-direction:column;gap:.3rem;text-decoration:none;color:var(--ink);transition:transform .25s}
.card:hover{transform:translateY(-4px);color:var(--ink)}.card h3{margin:.5rem 0 0}
.cover{position:relative;aspect-ratio:2/3;border-radius:4px 12px 12px 4px;overflow:hidden;background:var(--soft);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:1.2rem;font:600 1.55rem/1.1 var(--serif);color:var(--soft-ink);box-shadow:var(--sh),inset 6px 0 8px -6px rgba(0,0,0,.3);border:1px solid var(--line)}
.cover small{font:400 .75rem var(--ui);color:var(--mute);margin-top:.8rem}.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.price{font-weight:600;font-size:1.05rem;margin:.1rem 0}.price s{color:var(--mute);font-weight:400}.price.big{font-size:1.5rem;margin:1rem 0}
.tag{display:inline-block;font-size:.76rem;font-weight:600;background:var(--soft);color:var(--soft-ink);border-radius:99px;padding:.15rem .65rem;margin:.15rem .3rem .15rem 0}
.tag.sun{background:var(--sun);color:var(--sunink)}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0;color:var(--mute);font-size:.92rem}
.box,.tile{display:block;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.2rem;margin:0 0 1rem;box-shadow:var(--sh);color:var(--ink);text-decoration:none}
.tile{transition:border-color .2s,transform .2s}.tile:hover{border-color:var(--pink);transform:translateY(-2px);color:var(--ink)}.tile h3,.box h3{margin:0 0 .2em}
.state{padding:1.6rem;border:1px dashed var(--line);border-radius:var(--r);color:var(--mute);text-align:center;background:color-mix(in srgb,var(--panel) 60%,transparent)}
.state.bad{color:#b3261e;border-color:#b3261e}
.skel{border-radius:8px;height:1rem;background:var(--panel2);animation:sh 1.3s ease-in-out infinite}@keyframes sh{50%{opacity:.45}}
button,.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.55rem 1.3rem;font:600 .95rem var(--ui);background:var(--acc);color:var(--onacc);border:1px solid transparent;border-radius:99px;cursor:pointer;text-decoration:none;transition:background .2s,transform .1s}
button:hover,.btn:hover{background:var(--accH);color:var(--onacc)}button:active,.btn:active{transform:translateY(1px)}
button.alt,.btn.alt{background:transparent;color:var(--link);border-color:color-mix(in srgb,var(--pink) 55%,var(--line))}button.alt:hover,.btn.alt:hover{background:var(--soft);color:var(--soft-ink)}
button.big,.btn.big{min-height:52px;padding:.7rem 1.8rem;font-size:1.05rem}button.sm{min-height:36px;padding:.2rem .8rem}
button:disabled{background:var(--panel2);color:var(--mute);cursor:not-allowed}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,textarea,select{font:inherit;width:100%;padding:.65rem .85rem;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);min-height:44px}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}select.sm{width:auto;min-height:36px;padding:.2rem .6rem}
label{font-weight:600;font-size:.9rem;display:grid;gap:.3rem}
form{display:grid;gap:.9rem;max-width:440px}.wide form{max-width:none}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}.mute{color:var(--mute)}
.bookhead{display:grid;gap:1.5rem;margin-bottom:2.5rem}.bookhead .cover{width:min(62%,240px);margin:0 auto}

.chaps{display:grid;gap:.5rem}.chap{display:flex;gap:1rem;align-items:center;padding:.8rem 1rem;background:var(--panel);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);transition:border-color .2s}
.chap:hover{border-color:var(--pink);color:var(--ink)}.chap b{font:600 1.3rem var(--serif);color:var(--link);min-width:1.6rem}
.rbar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--acc);z-index:30;transition:width .2s}

.page{max-width:46rem;margin:0 auto;background:var(--page);border:1px solid var(--line);border-radius:6px;padding:clamp(1.5rem,6vw,4rem) clamp(1.3rem,6vw,4.2rem);box-shadow:var(--sh)}

.page h1::after{content:"";display:block;width:2.5rem;height:2px;background:var(--pink);margin:1rem auto 0}
.read{font-family:var(--serif);font-size:var(--fs,1.3rem);line-height:1.85;font-weight:500}.read p{margin:0 0 1.1em}
.read p.dc::first-letter{font-size:3.2em;float:left;line-height:.85;padding:.08em .1em 0 0;color:var(--acc)}
.rnav{display:flex;justify-content:space-between;max-width:46rem;margin:1.5rem auto 0}
details.sp summary{cursor:pointer;color:var(--link);font-weight:600}
#toast{position:fixed;bottom:1.2rem;left:50%;transform:translate(-50%,200%);background:var(--ink);color:var(--bg);padding:.7rem 1.3rem;border-radius:99px;transition:transform .3s;z-index:40;max-width:90vw}#toast.on{transform:translate(-50%,0)}
@media(max-width:820px){

 nav{position:fixed;top:3.7rem;left:0;right:0;flex-direction:column;justify-content:flex-start;background:var(--panel);padding:.6rem 1rem 1rem;border-bottom:1px solid var(--line);box-shadow:var(--sh);transform:translateY(-140%);transition:transform .25s;visibility:hidden}
 nav.open{transform:none;visibility:visible}nav a{padding:.85rem 1rem;font-size:1.05rem}}

.opt i{display:block;width:100%;height:56px;border-radius:8px;border:1px solid var(--line)}
[data-theme=dark] .state.bad{color:#F5B7C8;border-color:var(--pink)}

header{padding:.55rem clamp(1rem,4vw,2rem)}main{max-width:1180px}

.bookhead{background:none;border-radius:0;padding:0 0 2.4rem;border-bottom:1px solid var(--line)}
.bookhead h1{font-size:clamp(2.4rem,6vw,4rem);line-height:1.02;margin-bottom:.2em}
.bookhead .by{font:italic 500 1.3rem var(--serif);margin-bottom:.8rem}
.bookhead .desc{font:500 1.18rem/1.7 var(--serif);max-width:38rem}
.bookhead .price.big{font:600 1.7rem var(--serif)}
.chaps{gap:0}.chap{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:.95rem .2rem;gap:1.2rem}
.chap:hover{background:var(--soft)}.chap b{font:500 1.6rem var(--serif);min-width:2.2rem}.chap span{font:500 1.15rem var(--serif)}
.rtools{position:sticky;top:3.6rem;z-index:15;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding:.5rem 0;border-bottom:1px solid var(--line);margin-bottom:1.4rem}
.idx{position:relative}.idx summary{cursor:pointer;color:var(--link);font-weight:600;font-size:.92rem;list-style:none}.idx summary::-webkit-details-marker{display:none}
.idx-m{position:absolute;top:calc(100% + .5rem);left:0;width:min(86vw,360px);max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:.4rem;display:grid;z-index:30}
.idx-m a{padding:.55rem .8rem;border-radius:10px;text-decoration:none;color:var(--ink);font:500 1.05rem var(--serif)}.idx-m a:hover,.idx-m a.on{background:var(--soft);color:var(--soft-ink)}
.page{border-color:transparent;box-shadow:0 1px 2px rgba(90,20,45,.08),0 30px 60px -40px rgba(90,20,45,.45)}
.read{text-align:justify;hyphens:auto}
.page h1::after{content:"✦";width:auto;height:auto;background:none;color:var(--pink);font-size:1rem;margin-top:.8rem}
.auth{display:grid;max-width:880px;margin:1.5rem auto;border:1px solid var(--line);border-radius:28px;overflow:hidden;background:var(--page);box-shadow:var(--sh)}
@media(min-width:760px){.auth{grid-template-columns:1fr 1.1fr}}
.auth aside{position:relative;isolation:isolate;overflow:hidden;background:var(--soft);padding:clamp(1.5rem,5vw,3rem);display:flex;flex-direction:column;justify-content:flex-end;min-height:170px}
.auth aside .moon{position:absolute;right:-10%;top:-10%;width:260px;fill:color-mix(in srgb,var(--pink) 28%,transparent);z-index:-1}
.auth aside h2{font-size:2.2rem;color:var(--link);margin:0 0 .3em}.auth aside p{margin:0;font:italic 500 1.2rem var(--serif);color:var(--mute)}
.auth-f{padding:clamp(1.5rem,5vw,3rem)}.auth-f h1{font-size:2.2rem}.auth-f form{max-width:none}.auth+p{text-align:center}
footer{font:italic 500 1.1rem var(--serif);padding:2rem 1rem}.fl a{font:600 .72rem var(--ui);letter-spacing:.14em;text-transform:uppercase;text-decoration:none}

/* ===== v4: editorial, cores lisas, sem sublinhado ===== */
:root,[data-theme]{--sh:none}
a,a:hover,a:focus,a:active,a:visited{text-decoration:none!important}
a{cursor:pointer}
main p a,.state a,.mute a,.rtools>a,.sh a,.fl a,details.idx a{font-weight:600;border-radius:6px;padding:.05em .3em;margin:0 -.3em;transition:background .2s,color .2s}
main p a:hover,.state a:hover,.mute a:hover,.rtools>a:hover,.sh a:hover,.fl a:hover{background:var(--soft);color:var(--soft-ink)}
.sh a::after,.fl a::after{content:" \2192"}
a[target=_blank]::after{content:" \2197"}
.rtools>a::before{content:"\2190  "}
body{background:var(--bg)}
#toast{background:var(--acc);color:var(--onacc)}
.cover{border:0;box-shadow:0 1px 1px rgba(60,20,40,.1),0 16px 24px -18px rgba(90,20,45,.5),inset 4px 0 5px -4px rgba(0,0,0,.22)}
.card:hover .cover,.bk:hover .cover{box-shadow:0 1px 1px rgba(60,20,40,.1),0 16px 24px -18px rgba(90,20,45,.5),inset 4px 0 5px -4px rgba(0,0,0,.22)}
.feat{background:var(--soft);border:0;border-radius:10px}.feat::before{display:none}.feat-c .cover{transform:none}.feat .cover{background:var(--page)}
.uni,.uhead,.split,.auth aside,.cont{background:var(--soft);border:0;border-radius:10px}
.cont:hover{border:0;filter:none}
.auth{border-radius:10px;border-color:var(--line)}
.box,.tile{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:1.1rem 0;margin:0}
.tile:hover{border-top-color:var(--pink);transform:none}
.box.wide{border-radius:0}
.acct-m,.idx-m{border-radius:10px}
.page{border:1px solid var(--line);border-radius:4px}
.opts{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.opt{background:none;border:1px solid var(--line);border-radius:10px;font-weight:600;font-size:.9rem}
.opt:hover{background:var(--soft);border-color:var(--line);color:var(--soft-ink)}
.opt[aria-pressed=true]{background:var(--soft);border-color:var(--acc);box-shadow:none;color:var(--soft-ink)}
.opt i{width:28px;height:28px;border-radius:50%;margin:0 auto}
.av img{width:100%;height:100%;object-fit:cover;display:block}.av{overflow:hidden}.av.lg{width:4.5rem;height:4.5rem;font-size:1.8rem}
fieldset.avp{border:0;padding:0;margin:0 0 1.4rem;min-width:0}
.avp legend{font:600 .74rem var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--link);margin:0 0 .8rem;padding:0}
.avg{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:.4rem}
.avb{flex-direction:column;gap:.4rem;min-height:0;padding:.7rem .3rem;background:none;color:var(--mute);border:1px solid transparent;border-radius:10px;font:600 .68rem var(--ui);letter-spacing:.1em;text-transform:uppercase}
.avb .av{width:3.6rem;height:3.6rem}
.avb:hover{background:var(--soft);color:var(--soft-ink)}
.avb[aria-checked=true]{background:var(--soft);border-color:var(--acc);color:var(--soft-ink)}
.cm{display:flex;gap:.6rem;align-items:flex-start;margin:.7rem 0}.cm p{margin:0}.cm .av{width:1.9rem;height:1.9rem;font-size:.9rem}
.hs{position:relative;display:flex;align-items:center;flex:0 1 240px;max-width:none}
.hs svg,.sq svg{width:1rem;height:1rem;stroke:var(--mute);fill:none;stroke-width:1.8;stroke-linecap:round;flex:none}
.hs svg{position:absolute;left:.1rem;pointer-events:none}
.hs input{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;min-height:38px;padding:.3rem .3rem .3rem 1.6rem;font-size:.92rem;outline:0}
.hs input:focus,.sq:focus-within{border-color:var(--acc)}
@media(max-width:820px){.hs{display:none}}
.bar{gap:1rem;margin-bottom:.8rem}
.sq{display:flex;align-items:center;gap:.7rem;flex:1 1 260px;max-width:460px;border-bottom:1px solid var(--line);font-weight:400;transition:border-color .2s}
.sq input{flex:1;max-width:none;min-height:46px;border:0;background:transparent;border-radius:0;padding:.5rem 0;font-size:1.05rem;outline:0}
.bar select.sm{border:0;background:transparent;color:var(--mute);font-weight:600;font-size:.88rem;padding:.2rem .3rem;cursor:pointer}
a[href]{-webkit-tap-highlight-color:transparent}.fl{flex-wrap:wrap;gap:.6rem 1.2rem}.fl a{white-space:nowrap}

#toast{opacity:0;visibility:hidden;pointer-events:none;transition:transform .3s,opacity .2s,visibility .3s}
#toast.on{opacity:1;visibility:visible}
/* barras fixas totalmente opacas: nada do conteúdo (ex.: botão rosa) aparece por trás das abas */
header{background:var(--bg);backdrop-filter:none}
body:not(.is-adm) #tabs{background:var(--bg)!important;backdrop-filter:none!important;z-index:40}
.rtools{background:var(--bg);backdrop-filter:none}
button.chip{background:none;border:0;border-radius:99px;color:var(--mute);padding:.2rem .8rem;min-height:34px}
button.chip:hover{background:var(--soft);color:var(--soft-ink)}
button.chip[aria-pressed=true]{background:var(--soft);color:var(--soft-ink);border:0}

body.is-adm .hs{display:none}
nav a{white-space:nowrap}
.box .row{margin-top:.7rem}
/* ===== v5: capítulos bloqueados, Pix, comprovante ===== */
.chap.locked{cursor:default;background:none}.chap.locked:hover{background:none}
.chap.locked b,.chap.locked span{color:var(--mute);font-weight:400}
.chap .st{margin-left:auto;display:inline-flex;align-items:center;gap:.4rem;font:600 .68rem var(--ui);font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.chap .st.free{color:var(--link)}
.chap .st svg,.lockbox svg,.idx-m .lk svg{width:1rem;height:1rem;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.idx-m .lk{display:flex;align-items:center;gap:.5rem;padding:.55rem .9rem;color:var(--mute);cursor:default}
.lockbox{text-align:center;max-width:34rem;margin:3rem auto;padding:1rem}.lockbox svg{width:2.4rem;height:2.4rem;color:var(--link)}.lockbox .row{justify-content:center}
.pixbox{border-top:1px solid var(--line);padding:1.1rem 0;margin-top:1rem}
.pixv{font:500 2rem var(--serif);margin:.1rem 0 .8rem}
.pixqr{display:block;margin:.6rem 0;border-radius:8px;background:#fff;padding:8px}
.pixc{display:block;word-break:break-all;font-size:.82rem;background:var(--soft);color:var(--soft-ink);padding:.7rem .8rem;border-radius:8px;margin:.4rem 0 .6rem;user-select:all}
.proof{border-top:1px solid var(--line);margin-top:1rem;padding-top:1rem}.proof label{display:block;font-weight:600;margin-bottom:.8rem}
.proof input[type=file]{display:block;margin-top:.5rem;font:inherit;max-width:100%}
/* o menu do avatar (Minha conta, Configurações, Admin, Sair) agora também aparece no celular */
@media(max-width:820px){.acct{display:block}.tools{gap:.6rem}.acct-m{right:0;min-width:200px}}
.sess{margin-top:2rem;border-top:1px solid var(--line);padding-top:1.2rem}
a,a:hover,a:focus{text-decoration:none}
#toast{background:var(--acc);color:var(--onacc)}
.feat .moon,.hero .moon{display:none}
.bar{margin:0 0 .6rem}.bar .sq input{background:transparent;border-color:transparent;border-bottom:1px solid var(--line);border-radius:0;min-height:38px;font-size:.92rem}.bar .sq input:focus{border-bottom-color:var(--pink);outline:none}
.seg{display:inline-flex;gap:.3rem;padding:.25rem;background:var(--panel2);border-radius:99px;margin:0 0 1.4rem}
.seg a{padding:.45rem 1.3rem;border-radius:99px;font-weight:600;color:var(--mute)}.seg a:hover{color:var(--soft-ink)}.seg a.on{background:var(--acc);color:var(--onacc)}
.ost{font-weight:600;margin:.5rem 0}
fieldset.box legend{padding:0 .4rem}
/* ===== v6: engrenagem, spoiler discreto, ação de perigo ===== */
.gear{display:inline-grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:50%;color:var(--mute);flex:none;transition:background .2s,color .2s}
.gear:hover{background:var(--soft);color:var(--soft-ink)}.gear.on{color:var(--link)}
.gear svg{width:1.3rem;height:1.3rem;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
label.chk{display:inline-flex;align-items:center;gap:.45rem;width:max-content;max-width:100%;font-weight:400;font-size:.82rem;color:var(--mute);cursor:pointer}
label.chk input{width:1rem;height:1rem;min-height:0;padding:0;margin:0;accent-color:var(--acc)}
button.danger{background:transparent;color:#b3261e;border-color:#b3261e}button.danger:hover{background:#b3261e;color:#fff}
[data-theme=dark] button.danger{color:#F5B7C8;border-color:#F5B7C8}[data-theme=dark] button.danger:hover{background:#F5B7C8;color:#2A1220}
/* sinopse recolhida */
.desc.syn{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
button.more{min-height:0;padding:.1rem 0;margin:.1rem 0 .8rem;background:none;border:0;color:var(--link);font:600 .9rem var(--ui)}
button.more:hover{background:none;color:var(--linkH)}button.more[hidden]{display:none}
/* ===== v7: aviso em barra de notificação (antes era uma bolinha) ===== */
#toast{top:calc(env(safe-area-inset-top,0px) + 4.2rem);bottom:auto;left:50%;right:auto;width:max-content;max-width:min(92vw,520px);border-radius:12px;padding:.75rem 1.1rem;text-align:center;font:600 .92rem/1.4 var(--ui);overflow-wrap:anywhere;transform:translate(-50%,-160%);box-shadow:0 10px 28px -10px rgba(0,0,0,.4)}
#toast.on{transform:translate(-50%,0);pointer-events:auto;cursor:pointer}
</style>

<script>
// Somente chave PÚBLICA (publishable). Nunca coloque service_role aqui.
const SB_URL='https://eulrdtkuxafhrygsbyuh.supabase.co', SB_KEY='sb_publishable_Vp3ulHnGeIPXfcT2P5y71A_olQSr9wp';
const sb=supabase.createClient(SB_URL,SB_KEY);
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const pub=(b,p)=>p?sb.storage.from(b).getPublicUrl(p).data.publicUrl:null;
const state=(m,bad)=>`<p class="state${bad?' bad':''}">${m}</p>`;
const go=p=>{location.hash='#'+p};
const fmt=d=>new Date(d).toLocaleDateString('pt-BR');
let user=null,isAdmin=false,myProf=null,roleP=Promise.resolve();

// ---- tema (persistente) ----
const setTheme=t=>{document.documentElement.dataset.theme=t;localStorage.setItem('ll-theme',t)};
const applyTheme=setTheme;applyTheme(localStorage.getItem('ll-theme')||'light');
document.documentElement.style.setProperty('--fs',(localStorage.getItem('ll-fs')||1.3)+'rem');
addEventListener('error',e=>toast('Erro: '+(e.message||'inesperado')));addEventListener('unhandledrejection',e=>toast('Erro: '+(e.reason?.message||e.reason||'inesperado')));
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),Math.min(9000,Math.max(3500,String(m).length*70)));t.onclick=()=>{clearTimeout(toast.t);t.classList.remove('on')}};

// ---- cabeçalho ----
const nav=document.getElementById('nav'),menu=document.getElementById('menu');
menu.onclick=()=>{const o=nav.classList.toggle('open');menu.setAttribute('aria-expanded',o)};
function header(){
  const cur=(location.hash.slice(1)||'/').split('?')[0],adm=cur.startsWith('/admin');
  const pubL=[['/','Início'],['/catalogo','Catálogo'],...(user?[['/minha-estante','Minha estante']]:[]),['/comunidade','Comunidade'],['/universos','Universos'],['/quizzes','Quizzes'],...(user?[['/minha-conta','Minha conta']]:[]),['/configuracoes','Configurações'],...(isAdmin?[['/admin','Administração']]:[])];
  const admL=[['/admin','Painel'],['/admin/livros','Livros'],['/admin/pedidos','Pedidos'],['/admin/usuarios','Usuários'],['/admin/importar','Importar'],['/admin/configuracoes','Pix'],['/','Voltar ao site']];
  const a=user?'<button class="alt" data-a="logout">Sair</button>':'<a class="btn" href="#/login">Entrar</a>';
  nav.innerHTML=(adm?admL:pubL).map(([p,t])=>`<a href="#${p}"${cur===p?' class="on" aria-current="page"':''}>${t}</a>`).join('')+`<span class="navauth">${a}</span>`;
  document.getElementById('auth').innerHTML=a;document.getElementById('admtag').hidden=!adm;nav.classList.remove('open');menu.setAttribute('aria-expanded','false');
}
const MOON='<svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

// ---- páginas ----
const priceHtml=b=>b.is_launch_active?`<s>${brl(b.price_regular_cents)}</s> ${brl(b.effective_price_cents)}`:brl(b.effective_price_cents);
const badges=b=>`${b.is_launch_active?'<span class="tag sun">Lançamento</span>':''}${b.published_chapter_count?'':'<span class="tag">Conteúdo ainda não disponível</span>'}${b.is_purchasable?'':'<span class="tag">Compra ainda não disponível</span>'}`;
const coverHtml=b=>{const c=pub('book-covers',b.cover_path);return c?`<img src="${esc(c)}" alt="Capa de ${esc(b.title)}">`:`${esc(b.title)}<small>Capa em breve</small>`};
const bookCard=b=>`<a class="card" href="#/livro/${esc(b.slug)}"><div class="cover">${coverHtml(b)}</div><h3>${esc(b.title)}</h3><p class="price">${priceHtml(b)}</p>${b.description?`<p class="clamp">${esc(b.description)}</p>`:''}<div>${badges(b)}</div></a>`;
const books=async()=>{const {data,error}=await sb.from('book_catalog').select('*').eq('status','published').order('sort_order');if(error)throw error;return data};

async function home(){
  const [bk,{data:un,error:e2}]=await Promise.all([books(),sb.from('universes').select('slug,name').order('sort_order')]);
  if(e2)throw e2;
  app.innerHTML=`<section class="hero"><h1>Luna's Library</h1><p class="lead">Livros e universos.</p><div class="row"><a class="btn big" href="#/catalogo">Ver catálogo</a>${user?'':'<a class="btn alt big" href="#/cadastro">Criar conta</a>'}</div></section>
  <section><div class="sh"><h2>Livros</h2><a class="btn alt sm" href="#/catalogo">Ver todos</a></div>${bk.length?`<div class="grid">${bk.map(bookCard).join('')}</div>`:state('Nenhum livro cadastrado ainda.')}</section>
  <section class="split"><div><div class="sh"><h2>Universos</h2><a class="btn alt sm" href="#/universos">Explorar</a></div>${un.length?un.map(u=>`<a class="tile" href="#/universos/${esc(u.slug)}"><h3>${esc(u.name)}</h3></a>`).join(''):state('Nenhum universo cadastrado ainda.')}</div>
  <div><div class="sh"><h2>Comunidade</h2><a class="btn alt sm" href="#/comunidade">Participar</a></div><a class="tile" href="#/comunidade"><h3>Publicações dos leitores</h3></a></div></section>`;
}
async function catalogo(){const bk=await books();app.innerHTML=`<h1>Catálogo</h1>${bk.length?`<div class="grid">${bk.map(bookCard).join('')}</div>`:state('Nenhum livro disponível no catálogo.')}`}

async function livro(slug){
  const {data:b,error}=await sb.from('book_catalog').select('*').eq('slug',slug).maybeSingle();
  if(error)throw error;
  if(!b){app.innerHTML=state('Livro não encontrado.');return}
  const {data:ch,error:e2}=await sb.from('chapters').select('id,position,title,is_free_preview').eq('book_id',b.id).order('position');if(e2)throw e2;
  await roleP;
  let owned=false,order=null,pay=null,prog=null,last=null;
  if(user){
    owned=!!(await sb.from('book_entitlements').select('id').eq('user_id',user.id).eq('book_id',b.id).eq('status','active').maybeSingle()).data;
    if(owned)prog=(await sb.from('reading_progress').select('chapter_id,progress_percent').eq('user_id',user.id).eq('book_id',b.id).order('last_read_at',{ascending:false}).limit(1).maybeSingle()).data;
    else{
      order=(await sb.from('orders').select('id,amount_cents,order_number').eq('user_id',user.id).eq('book_id',b.id).eq('status','pending').maybeSingle()).data;
      if(order){
        pay=(await sb.from('payments').select('id,status').eq('order_id',order.id).in('status',['pending','proof_submitted']).maybeSingle()).data;
      }else last=(await sb.from('orders').select('id,status,payments(status)').eq('user_id',user.id).eq('book_id',b.id).neq('status','pending').order('created_at',{ascending:false}).limit(1).maybeSingle()).data;
    }
  }
  const canRead=owned||isAdmin;
  const cur=prog&&ch.find(x=>x.id===prog.chapter_id);let action;
  if(owned)action=ch.length?`<a class="btn big" href="#/ler/${esc(b.slug)}/${(cur||ch[0]).position}">${cur?'Continuar lendo':'Começar a ler'}</a>${prog?`<div class="pbar" role="progressbar" aria-label="Progresso de leitura" aria-valuenow="${prog.progress_percent}" aria-valuemin="0" aria-valuemax="100"><i style="width:${prog.progress_percent}%"></i></div>`:''}`:'<button class="big" disabled>Conteúdo ainda não disponível</button>';
  else if(order)action=pay?.status==='proof_submitted'
    ?`<div class="box"><span class="tag">🟠 Pagamento em análise</span> <span class="mute">Pedido ${ordN(order.order_number)}</span><p><strong>Pagamento enviado.</strong> A administração vai conferir. O acesso aos capítulos pagos só é liberado depois dessa confirmação.</p><p class="mute">Valor: ${brl(order.amount_cents)}</p></div>`

  const [{data:orig},{data:tr}]=await Promise.all([sb.from('chapter_contents').select('body').eq('chapter_id',c.id).maybeSingle(),sb.from('chapter_translations').select('language,title,body').eq('chapter_id',c.id)]);

  const t=(tr||[]).find(x=>x.language===lang);
  const show=t?{title:t.title,body:t.body,l:lang}:{title:c.title,body:orig.body,l:'pt-BR'};

  <article class="page"><h1>${esc(show.title)}</h1><div class="read">${renderBody(show.body)}</div></article>
  <div class="rnav">${prev?`<a class="btn alt" href="#/ler/${esc(slug)}/${prev.position}?l=${show.l}">Capítulo anterior</a>`:'<span></span>'}${next?(full||next.is_free_preview?`<a class="btn" href="#/ler/${esc(slug)}/${next.position}?l=${show.l}">Próximo capítulo</a>`:`<a class="btn" href="#/livro/${esc(slug)}">Desbloquear o livro</a>`):'<span></span>'}</div>${next&&!full&&!next.is_free_preview?'<p class="mute" style="text-align:center">Fim da prévia gratuita. Os próximos capítulos são liberados depois da confirmação do pagamento.</p>':''}`;
  const s=document.getElementById('lang');if(s)s.onchange=()=>go(`/ler/${slug}/${pos}?l=${s.value}`);

const NUMW={um:1,dois:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,treze:13,quatorze:14,catorze:14,quinze:15,dezesseis:16,dezessete:17,dezoito:18,dezenove:19,vinte:20,trinta:30,quarenta:40,cinquenta:50,sessenta:60,setenta:70,oitenta:80,noventa:90};
const numPT=t=>{const w=t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/^\s*capitulo\s+/,'').split(/\s+/).filter(x=>x&&x!=='e');let n=0;for(const x of w){if(!(x in NUMW))return null;n+=NUMW[x]}return n||null};
const readFile=f=>f.text?f.text():new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsText(f)});
function inl(n,top=true){let o='';for(const c of n.childNodes){
  if(c.nodeType===3)o+=c.textContent.replace(/\s+/g,' ');
  else if(c.nodeType===1){const t=c.tagName,i=inl(c,false),w=k=>{const m=i.match(/^(\s*)([\s\S]*?)(\s*)$/);return m[2]?m[1]+k+m[2]+k+m[3]:i};
    if(t==='BR')o+='\n';else if(t==='STRONG'||t==='B')o+=w('**');else if(t==='EM'||t==='I'||c.classList.contains('ember'))o+=w('_');else if(c.classList.contains('whisper'))o+=w('~');else o+=i}}
  return top?o.replace(/ *\n */g,'\n').trim():o}
function parseBook(html){
  const d=new DOMParser().parseFromString(html,'text/html'),m=d.querySelector('main'),chapters=[],warn=[];let cur=null,sinopse=null;
  if(!m)return {chapters,sinopse,warn:['arquivo sem <main>']};
  for(const el of m.children){
    if(el.matches('section.sinopse')){sinopse=[...el.querySelectorAll('p')].map(p=>p.textContent.replace(/\s+/g,' ').trim()).filter(Boolean).join('\n\n');continue}
    if(el.matches('h2.chapter-title')){const sm=el.querySelector('small');const lab=sm?sm.textContent:'',ep=/^\s*ep[ií]logo\s*$/i.test(lab),tt=[...el.childNodes].filter(x=>x!==sm).map(x=>x.textContent).join('').replace(/\s+/g,' ').trim();cur={n:ep?'EP':numPT(lab),title:ep?'Epílogo: '+tt:tt,paras:[]};chapters.push(cur);continue}
    if(!cur)continue;
    if(el.matches('div.pov-badge'))cur.paras.push('@pov '+el.textContent.replace(/^\s*ponto de vista\s*[—-]\s*/i,'').trim());
    else if(el.matches('p')){const t=inl(el);if(t)cur.paras.push(t)}
    else if(el.matches('div.rupture')){for(const p of el.querySelectorAll('p')){const t=inl(p);if(t)cur.paras.push('> '+t)}}
    else warn.push('elemento ignorado: '+el.tagName)}
  return {chapters:chapters.map(c=>({n:c.n,title:c.title,body:c.paras.join('\n\n')})),sinopse,warn};
}

async function adminImportar(){

    document.getElementById('imp-sum').innerHTML=`<p><strong>${all.length} capítulos</strong> (${ns[0]||'?'} a ${ns[ns.length-1]||'?'}), ${all.reduce((a,c)=>a+c.body.length,0).toLocaleString('pt-BR')} caracteres.<br><span class="mute">${per.join(' · ')}</span></p>

    <label><span><input id="imp-free" type="checkbox" checked style="width:auto"> Capítulo 1 como prévia gratuita</span></label>
    <label><span><input id="imp-syn" type="checkbox" ${sin?'checked':'disabled'} style="width:auto"> Usar a sinopse do arquivo como descrição${sin?'':' (não encontrada)'}</span></label>

  };
}

let AVS=AVBASE.slice(),AVM=new Map(AVS.map(([k,n,u])=>[k,{n,u}])),AVCUSTOM=[];
const avRefresh=async()=>{
  try{const {data,error}=await sb.from('avatar_presets').select('key,name,path').order('sort_order').order('created_at');if(error)throw error;AVCUSTOM=data||[]}catch(e){AVCUSTOM=[]}
  AVS=[...AVBASE,...AVCUSTOM.map(a=>[a.key,a.name,pub('avatars',a.path)])];AVM=new Map(AVS.map(([k,n,u])=>[k,{n,u}]));
};
const avP=avRefresh().then(()=>{try{header()}catch(e){}});
const avResize=file=>new Promise((ok,no)=>{const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{URL.revokeObjectURL(url);const S=256,c=document.createElement('canvas');c.width=c.height=S;const m=Math.min(im.width,im.height);
    c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,S,S);
    c.toBlob(b=>b?ok(b):no(new Error('Não foi possível processar a imagem.')),'image/webp',.86)};
  im.onerror=()=>{URL.revokeObjectURL(url);no(new Error('Imagem inválida.'))};im.src=url});
const avHtml=(path,name,cls='')=>{const k=String(path||'').startsWith('preset:')?String(path).slice(7):'',a=AVM.get(k);
  return a?`<span class="av ${cls}" role="img" aria-label="Avatar ${esc(a.n)}"><img src="${esc(a.u)}" alt=""></span>`:`<span class="av ${cls}">${esc(ini(name))}</span>`};
const avPicker=cur=>`<fieldset class="avp"><legend>Escolha seu avatar</legend><div class="avg" role="radiogroup" aria-label="Avatares disponíveis">${AVS.map(([k,n])=>`<button type="button" class="avb" role="radio" aria-checked="${cur==='preset:'+k}" data-a="avatar" data-k="${k}">${avHtml('preset:'+k,n)}<span>${n}</span></button>`).join('')}</div></fieldset>`;
const profileBox=(p,since)=>`<div class="box"><div class="who">${avHtml(p?.avatar_path,p?.display_name,'lg')}<div><strong>${esc(p?.display_name||'Leitor')}</strong><br><span class="mute">${esc(user.email)}${since?`<br>Conta criada em ${fmt(user.created_at)}`:''}</span></div></div>${avPicker(p?.avatar_path)}<form data-f="profile"><label>Nome de exibição<input name="n" maxlength="60" value="${esc(p?.display_name||'')}"></label><button>Salvar nome</button></form></div>`;
const loadProf=async()=>{if(!user){myProf=null;header();return}const {data}=await sb.from('profiles').select('display_name,avatar_path').eq('id',user.id).maybeSingle();myProf=data;header()};

    f.reset();toast('Enviamos um link de confirmação. O e-mail só muda depois que você confirmar.')},
  avadd:async f=>{const nm=f.nm.value.trim(),file=f.img.files[0];if(!nm||!file)return toast('Informe o nome e escolha a imagem.');
    if(file.size>8*1024*1024)return toast('A imagem deve ter até 8 MB.');
    const blob=await avResize(file),ext=blob.type==='image/png'?'png':'webp';
    const key=(nm.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'avatar')+'-'+Date.now().toString(36).slice(-4),path=`presets/${key}.${ext}`;
    const {error:ue}=await sb.storage.from('avatars').upload(path,blob,{contentType:blob.type,upsert:false});if(ue)return fail(ue);
    const {error}=await sb.from('avatar_presets').insert({key,name:nm,path,sort_order:AVCUSTOM.length+1});
    if(error){await sb.storage.from('avatars').remove([path]);return fail(error)}
    f.reset();await avRefresh();toast('Avatar adicionado.');route()},
  quiz:async f=>{const ans={};f.querySelectorAll('input[type=radio]:checked').forEach(x=>{ans[x.name.slice(2)]=x.value});
    const {data,error}=await sb.rpc('submit_quiz_attempt',{p_quiz_id:f.dataset.id,p_answers:ans});if(error)return fail(error);
    document.getElementById('qres').innerHTML=`<div class="box"><h3>Sua pontuação</h3><p>${data.score} de ${data.max_score}</p></div>`},
  chpass:async f=>{if(f.p.value!==f.p2.value)return toast('As senhas não coincidem.');const {error}=await sb.auth.updateUser({password:f.p.value});if(error)return fail(error);f.reset();toast('Senha alterada.')},
  grant:async f=>{const {error}=await sb.rpc('admin_grant_access',{p_user_id:f.dataset.u,p_book_id:f.bk.value,p_notes:null});if(error)return fail(error);toast('Acesso liberado.');route()},
  book:async f=>{const reg=cents(f.pr.value),lau=cents(f.pl.value);if(reg===null||isNaN(reg)||isNaN(lau))return toast('Confira os preços.');
    const u={title:f.t.value,...(f.elements.namedItem('g')?{genre:f.g.value.trim()||null,author:f.au.value.trim()||'Thau Luna'}:{}),description:f.d.value||null,status:f.st.value,is_purchasable:f.pc.checked,price_regular_cents:reg,price_launch_cents:lau,launch_start_at:f.ls.value?new Date(f.ls.value).toISOString():null,launch_end_at:f.le.value?new Date(f.le.value).toISOString():null};
    const file=f.cv.files[0];if(file){const path=`${f.dataset.id}/cover-${Date.now()}`;const {error}=await sb.storage.from('book-covers').upload(path,file,{contentType:file.type});if(error)return fail(error);u.cover_path=path}
    const {error}=await sb.from('books').update(u).eq('id',f.dataset.id);if(error)return fail(error);toast('Livro salvo.');route()},
  pix:async f=>{const u={id:1,pix_key_type:f.kt.value||null,pix_key:f.k.value||null,receiver_name:f.rn.value||null,copy_paste_code:f.cc.value||null,instructions:f.ins.value||null,updated_by:user.id};
    const file=f.qr.files[0];if(file){const path=`qr-${Date.now()}`;const {error}=await sb.storage.from('pix-assets').upload(path,file,{contentType:file.type});if(error)return fail(error);u.qr_code_path=path}
    const {error}=await sb.from('pix_settings').upsert(u,{onConflict:'id'});if(error)return fail(error);toast('Pix salvo.');route()},
  login:async f=>{const {error}=await sb.auth.signInWithPassword({email:f.e.value,password:f.p.value});error?msg(error.message):go('/')},
  signup:async f=>{const {data,error}=await sb.auth.signUp({email:f.e.value,password:f.p.value,options:{data:{display_name:f.n.value}}});
    if(error)return msg(error.message);data.session?go('/'):msg('Verifique seu e-mail para confirmar o cadastro.')},
  reset:async f=>{const {error}=await sb.auth.resetPasswordForEmail(f.e.value,{redirectTo:location.href.split('#')[0]});msg(error?error.message:'Se o e-mail existir, você receberá um link.')},
  newpass:async f=>{const {error}=await sb.auth.updateUser({password:f.p.value});error?msg(error.message):go('/minha-conta')},
  profile:async f=>{const {data,error}=await sb.from('profiles').update({display_name:f.n.value.trim()||null}).eq('id',user.id).select('id');if(error)return fail(error);if(!data||!data.length)return toast('Não foi possível salvar.');await loadProf();toast('Nome salvo.');route()},
  post:async f=>{const {error}=await sb.from('posts').insert({body:f.b.value,is_spoiler:f.s.checked,book_id:f.dataset.book||null});error?fail(error):route()},
  comment:async f=>{const {error}=await sb.from('comments').insert({post_id:f.dataset.id,body:f.b.value});error?fail(error):loadComments(f.dataset.id)}
};
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=actions[b.dataset.a];if(!f)return toast('Ação indisponível.');
  b.disabled=true;b.setAttribute('aria-busy','true');try{await f(b)}catch(err){fail(err)}finally{if(b.isConnected){b.disabled=false;b.removeAttribute('aria-busy')}}});
document.addEventListener('submit',async e=>{const f=e.target,h=forms[f.dataset.f];if(!h)return;e.preventDefault();const btn=f.querySelector('button:not([type=button])');if(btn)btn.disabled=true;
  try{await h(new Proxy(f,{get:(t,k)=>{if(typeof k==='string'){const el=t.elements.namedItem(k);if(el)return el}const v=t[k];return typeof v==='function'?v.bind(t):v}}))}catch(err){fail(err)}finally{if(btn&&btn.isConnected)btn.disabled=false}});

const LOADER='<div aria-busy="true" aria-label="Carregando"><div class="skel" style="width:45%;height:2.4rem;margin-bottom:1.2rem"></div><div class="grid">'+'<div class="skel" style="aspect-ratio:2/3;height:auto"></div>'.repeat(3)+'</div></div>';
// ---- roteador (hash, funciona em hospedagem estática) ----
const routes=[[/^\/$/,home],[/^\/catalogo$/,catalogo],[/^\/livro\/([^/]+)$/,livro],[/^\/login$/,login],[/^\/cadastro$/,cadastro],[/^\/recuperar$/,recuperar],[/^\/minha-conta$/,conta,1],[/^\/minha-estante$/,estante,1],[/^\/quiz\/([^/]+)$/,quiz],[/^\/universos$/,universos],[/^\/universos\/([^/]+)$/,universo],[/^\/quizzes$/,quizzes],[/^\/ler\/([^/]+)\/(\d+)$/,ler],[/^\/admin$/,admin,1],[/^\/admin\/livros$/,adminLivros,1],[/^\/admin\/pedidos$/,adminPedidos,1],[/^\/admin\/usuarios$/,adminUsuarios,1],[/^\/admin\/configuracoes$/,adminPix,1],[/^\/admin\/importar$/,adminImportar,1],[/^\/admin\/avatares$/,adminAvatares,1],[/^\/configuracoes$/,configuracoes],[/^\/configuracoes\/conta$/,editarConta,1]];
async function route(){
  header();onscroll=null;const path=(location.hash.slice(1)||'/').split('?')[0];
  const raw=location.hash.slice(1);
  if(/^(access_token|error)=/.test(raw)){
    const hp=new URLSearchParams(raw);
    if(hp.get('error')||hp.get('error_code')){app.innerHTML='<h1>Link inválido ou expirado</h1>'+state('Este link de confirmação já foi usado ou expirou. Se você já confirmou o e-mail, basta entrar com e-mail e senha.')+'<p class="row"><a class="btn" href="#/login">Entrar</a><a class="btn alt" href="#/recuperar">Esqueci a senha</a></p>';return}
    app.innerHTML=LOADER;return}
  if(path!==route.last){scrollTo(0,0);route.last=path}
  for(const [re,fn,needAuth] of routes){const m=path.match(re);if(!m)continue;
    if(needAuth&&!user)return go('/login');
    app.innerHTML=LOADER;
    try{await avP;await fn(...m.slice(1))}catch(e){app.innerHTML=state('Não foi possível carregar os dados: '+esc(e.message||e),1)}
    return}
  app.innerHTML=state('Página não encontrada.');
}
addEventListener('hashchange',route);
sb.auth.onAuthStateChange((ev,s)=>{const id=s?.user?.id;if(ev==='PASSWORD_RECOVERY'){user=s.user;header();return novaSenha()}
  if(ev==='INITIAL_SESSION'||id!==user?.id){user=s?.user||null;isAdmin=false;const uid=user?.id;roleP=uid?sb.from('user_roles').select('role').eq('user_id',uid).eq('role','admin').maybeSingle().then(({data})=>{if(user?.id===uid){isAdmin=!!data;header()}},()=>{}):Promise.resolve();loadProf();const th=user?.user_metadata?.theme;if(['light','dark','sepia'].includes(th))applyTheme(th);route()}});
</script>
